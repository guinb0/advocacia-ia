# Keycloak para o login do Acervo.
#
#   docker compose up -d keycloak      -> sobe em http://localhost:8180
#   console admin: http://localhost:8180  (admin / admin)
#
# O estado vive em Postgres local por padrão. Isso evita o erro de inicialização
# quando o ambiente de desenvolvimento ainda não tem credenciais do SQL Server,
# mas continua persistente entre reinícios. Se quiser apontar para o SQL Server
# do escritório, preencha KEYCLOAK_DB_VENDOR=mssql e as variáveis KEYCLOAK_DB_*.
#
# `--import-realm` continua: com banco persistente ele só age quando o realm
# AINDA NÃO existe, então serve de semente na primeira subida e não atropela o
# que foi cadastrado depois.
#
# Continua `start-dev` (e não `start`) porque aqui é tudo localhost em HTTP:
# `start` exigiria hostname e HTTPS configurados. O que mudou é o banco.
services:
  jobs-db:
    image: postgres:16-alpine
    container_name: advocacia-jobs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: advocacia_jobs
      POSTGRES_USER: advocacia
      POSTGRES_PASSWORD: advocacia_local
    ports:
      - "5434:5432"
    volumes:
      - jobs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advocacia -d advocacia_jobs"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: advocacia-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  flower:
    image: mher/flower:2.0
    container_name: advocacia-flower
    restart: unless-stopped
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: advocacia-prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.5.2
    container_name: advocacia-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./observability/advocacia-dashboard.json:/var/lib/grafana/dashboards/advocacia.json:ro
    depends_on:
      - prometheus

  keycloak-db:
    image: postgres:16-alpine
    container_name: acervo-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${KEYCLOAK_DB_NAME:-keycloak}"
      POSTGRES_USER: "${KEYCLOAK_DB_USER:-keycloak}"
      POSTGRES_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-keycloak_local}"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: acervo-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USER:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD no .env}"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}"
      KC_DB: "${KEYCLOAK_DB_VENDOR:-postgres}"
      KC_DB_URL_HOST: "${KEYCLOAK_DB_HOST:-keycloak-db}"
      KC_DB_URL_PORT: "${KEYCLOAK_DB_PORT:-5432}"
      KC_DB_URL_DATABASE: "${KEYCLOAK_DB_NAME:-keycloak}"
      KC_DB_URL_PROPERTIES: "${KEYCLOAK_DB_URL_PROPERTIES:-}"
      KC_DB_USERNAME: "${KEYCLOAK_DB_USER:-keycloak}"
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-keycloak_local}"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # A partir da 25 a imagem não tem curl; o Keycloak expõe /health no 9000.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s

volumes:
  redis_data:
  grafana_data:
  jobs_postgres_data:
  keycloak_postgres_data:
