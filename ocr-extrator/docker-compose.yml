# Keycloak para o login do Acervo.
#
#   docker compose up -d keycloak      -> sobe em http://localhost:8180
#   console admin: http://localhost:8180  (admin / admin)
#
# `start-dev` usa banco em memória: o realm é reimportado do JSON a cada subida,
# então qualquer usuário criado pelo console some no próximo `up`. É o que se
# quer em desenvolvimento (o estado fica versionado no JSON, não no volume); para
# valer em produção, trocar por `start` + Postgres e remover o --import-realm.
services:
  jobs-db:
    image: postgres:16-alpine
    container_name: advocacia-jobs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: advocacia_jobs
      POSTGRES_USER: advocacia
      POSTGRES_PASSWORD: advocacia_local
    ports:
      - "5434:5432"
    volumes:
      - jobs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advocacia -d advocacia_jobs"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: advocacia-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  flower:
    image: mher/flower:2.0
    container_name: advocacia-flower
    restart: unless-stopped
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: advocacia-prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.5.2
    container_name: advocacia-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./observability/advocacia-dashboard.json:/var/lib/grafana/dashboards/advocacia.json:ro
    depends_on:
      - prometheus

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: acervo-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # A partir da 25 a imagem não tem curl; o Keycloak expõe /health no 9000.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  redis_data:
  grafana_data:
  jobs_postgres_data:
