# Keycloak para o login do Acervo.
#
#   docker compose up -d keycloak      -> sobe em http://localhost:8180
#   console admin: http://localhost:8180  (admin / admin)
#
# O estado vive no SQL SERVER DO ESCRITÓRIO, não mais no banco em memória do
# `start-dev`. Isso é o que faz o login ser o MESMO para todo mundo: quem for
# cadastrado aqui entra da máquina de qualquer outro. Antes, cada `up` recriava
# o realm a partir do JSON e o usuário criado pelo console sumia.
#
# As tabelas do Keycloak ficam no `dbo` do banco `advocacia`, ao lado das do
# ia-juridica. Não é bonito, e não foi por escolha:
#
#   - `CREATE DATABASE keycloak` exige `dbcreator` no servidor, e o login
#     `advocacia` só tem CONNECT SQL e VIEW ANY DATABASE;
#   - um schema `keycloak` à parte também não serve: no MSSQL o Keycloak exige
#     que o DEFAULT SCHEMA do usuário seja igual ao `KC_DB_SCHEMA` ("MSSQL does
#     not support setting the default schema per session"), e trocar o default
#     schema do login quebraria o ia-juridica e o ocr, que o compartilham.
#
# O caminho limpo depende de alguém com sysadmin: criar um banco `keycloak` (ou
# um login próprio com default schema `keycloak`). Feito isso, é só trocar o
# `databaseName` aqui e mover as tabelas — nada no app muda, porque o app só
# fala com o Keycloak por HTTP, nunca com o banco dele.
#
# As credenciais saem do `.env` (que o .gitignore cobre) — as MESMAS variáveis
# que o `app/banco.py` já usa. Nada de senha neste arquivo.
#
# `--import-realm` continua: com banco persistente ele só age quando o realm
# AINDA NÃO existe, então serve de semente na primeira subida e não atropela o
# que foi cadastrado depois.
#
# Continua `start-dev` (e não `start`) porque aqui é tudo localhost em HTTP:
# `start` exigiria hostname e HTTPS configurados. O que mudou é o banco.
services:
  jobs-db:
    image: postgres:16-alpine
    container_name: advocacia-jobs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: advocacia_jobs
      POSTGRES_USER: advocacia
      POSTGRES_PASSWORD: advocacia_local
    ports:
      - "5434:5432"
    volumes:
      - jobs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advocacia -d advocacia_jobs"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: advocacia-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  flower:
    image: mher/flower:2.0
    container_name: advocacia-flower
    restart: unless-stopped
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: advocacia-prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.5.2
    container_name: advocacia-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./observability/advocacia-dashboard.json:/var/lib/grafana/dashboards/advocacia.json:ro
    depends_on:
      - prometheus

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: acervo-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_DB: mssql
      # encrypt=true;trustServerCertificate=true: o servidor exige TLS mas o
      # certificado é auto-assinado — mesmo par que o `TrustServerCertificate=yes`
      # do ODBC em app/banco.py.
      KC_DB_URL: "jdbc:sqlserver://${SQLSERVER_HOST}:${SQLSERVER_PORT:-1433};databaseName=${SQLSERVER_DATABASE:-advocacia};encrypt=true;trustServerCertificate=true"
      KC_DB_USERNAME: "${SQLSERVER_USER:-advocacia}"
      KC_DB_PASSWORD: "${SQLSERVER_PASSWORD:?defina SQLSERVER_PASSWORD no .env}"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # A partir da 25 a imagem não tem curl; o Keycloak expõe /health no 9000.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s

volumes:
  redis_data:
  grafana_data:
  jobs_postgres_data:
