services:

  # ============================================================================
  # UM DOMINIO SO, E O TRAEFIK DECIDE PELO CAMINHO
  #
  # O Acervo tem tres processos que o navegador chama (front, API e
  # transcricao), e a tentacao e dar um subdominio para cada. Aqui nao serve:
  # o login e um cookie HttpOnly assinado pela API, e front e API precisam ser
  # o MESMO site para ele acompanhar a chamada (esta escrito no .env.example,
  # ao lado de JWT_COOKIE_SAMESITE). Com um dominio so, cookie e CORS deixam
  # de existir como problema e as NEXT_PUBLIC_* ficam vazias.
  #
  # Isso NAO reintroduz o proxy do Next, que foi removido de proposito (ver
  # frontend/next.config.ts): quem roteia e o Traefik, na borda, sem o teto de
  # 30s nem o buffer em memoria que matavam o upload de foto de celular.
  #
  # A prioridade importa: rotas mais especificas primeiro, senao o router do
  # front (que casa com tudo) engole /api.
  # ============================================================================

  frontend:
    image: registry.level33lab.cloud/ia/advocacia-ia:${IMAGE_TAG:-latest}
    command: ["node", "frontend/server.js"]
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 45s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
      restart_policy:
        condition: any
        delay: "5s"
        max_attempts: 0
        window: "30s"
      resources:
        limits:
          memory: 1G
          cpus: "1.00"
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        - "traefik.http.routers.acervo.rule=Host(`${DOMINIO?defina o dominio de producao}`)"
        - "traefik.http.routers.acervo.entrypoints=websecure"
        - "traefik.http.routers.acervo.tls=true"
        - "traefik.http.routers.acervo.tls.certresolver=httpresolver"
        - "traefik.http.routers.acervo.middlewares=hsts-headers"
        - "traefik.http.routers.acervo.priority=1"
        - "traefik.http.middlewares.hsts-headers.headers.stsSeconds=63072000"
        - "traefik.http.middlewares.hsts-headers.headers.stsPreload=true"
        - "traefik.http.services.acervo.loadbalancer.server.port=3000"
    networks:
      traefik-public:
        aliases:
          - acervo
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    image: registry.level33lab.cloud/ia/advocacia-ia:${IMAGE_TAG:-latest}
    environment: &ambiente_api
      # Nao-segredo fica aqui, fixo. So o que e segredo passa pelas variaveis
      # do GitLab (ver gitlab_variables no .gitlab-ci.yml) — mesmo criterio do
      # vig-agent, e menos coisa para a infra cadastrar a mao.
      URL_PORTAL: https://${DOMINIO?defina o dominio de producao}
      ORIGENS_PERMITIDAS: https://${DOMINIO?defina o dominio de producao}
      JWT_ISSUER: https://${DOMINIO?defina o dominio de producao}
      JWT_AUDIENCE: https://${DOMINIO?defina o dominio de producao}
      JWT_COOKIE_SECURE: "1"
      # Como a API alcanca a transcricao POR DENTRO. O Traefik so expoe
      # `/ws/transcricao` e `/entrevista` dela, entao o `/saude` nao e
      # alcancavel de fora — e era justamente ele que respondia se a chave da
      # OpenRouter chegou ao conteiner. Ver GET /api/saude/transcricao.
      URL_TRANSCRICAO_INTERNA: http://transcricao:8200
      JWT_COOKIE_SAMESITE: lax
      PERMITIR_DADOS_TESTE: "false"

      SQLSERVER_HOST: ${SQLSERVER_HOST?SQLSERVER_HOST is required}
      SQLSERVER_PORT: "1433"
      SQLSERVER_DATABASE: advocacia
      SQLSERVER_USER: advocacia
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD?SQLSERVER_PASSWORD is required}
      # `TrustServerCertificate=yes` ja e fixo em app/banco.py, entao o Driver
      # 18 (que exige criptografia) conecta sem certificado emitido.
      SQLSERVER_DRIVER: "ODBC Driver 18 for SQL Server"

      PGVECTOR_HOST: ${PGVECTOR_HOST?PGVECTOR_HOST is required}
      PGVECTOR_PORT: "5432"
      PGVECTOR_DB: advocacia_ia
      PGVECTOR_USER: ${PGVECTOR_USER?PGVECTOR_USER is required}
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD?PGVECTOR_PASSWORD is required}
      PGVECTOR_SSLMODE: prefer
      PGVECTOR_TABLE: knowledge_chunks

      # Vazio DESLIGA a autenticacao e abre a API inteira (ver app/auth.py).
      JWT_SECRET: ${JWT_SECRET?JWT_SECRET is required}
      # Vazio faz o servidor sortear uma por processo, e as sessoes do portal
      # do cliente caem a cada restart.
      PORTAL_SEGREDO: ${PORTAL_SEGREDO:-}

      # ------------------------------------------- porta de entrada (login)
      # Captcha do login. SECRET vazio DESLIGA o captcha e o login volta a
      # aceitar tentativa automatizada sem filtro (ver app/captcha.py). A SITE_KEY
      # e publica e chega ao navegador pelo /api/config.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}

      # Segundo fator por e-mail, exigido de todos os perfis internos.
      #
      # O padrao aqui era OBRIGATORIO=1 e derrubou o login de producao em
      # 10/09/2026: o recurso subiu sem SMTP cadastrado, e o par
      # "sem SMTP" + "obrigatorio" faz a rota responder 503 para TODO perfil
      # interno -- escritorio inteiro trancado do lado de fora. Agora o SMTP
      # existe (abaixo), entao o segundo fator funciona de verdade; o padrao
      # passa a 0 para que uma queda do SMTP volte a custar um aviso no log
      # ("SEGUNDO FATOR PULADO") em vez de custar o acesso de todo mundo.
      # Para exigir de novo, basta cadastrar DOIS_FATORES_OBRIGATORIO=1.
      DOIS_FATORES_OBRIGATORIO: ${DOIS_FATORES_OBRIGATORIO:-0}
      DOIS_FATORES_PERFIS_ISENTOS: cliente
      # Host, porta e remetente nao sao segredo: ficam fixos aqui, onde se leem
      # junto com o contexto. So o par usuario+senha vem das variaveis de CI
      # (criterio do cabecalho do .gitlab-ci.yml). A senha e uma "app password"
      # do Gmail -- a conta exige 2FA e nao aceita a senha normal via SMTP.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORTA: ${SMTP_PORTA:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      SMTP_SEGURANCA: ${SMTP_SEGURANCA:-starttls}
      # Vazio cai no SMTP_USUARIO (ver correio.py) -- que e o endereco certo, e
      # poupa uma variavel que teria de ser mantida em sincronia com ele.
      SMTP_REMETENTE: ${SMTP_REMETENTE:-}
      SMTP_REMETENTE_NOME: ${SMTP_REMETENTE_NOME:-Acervo — LARA & MELO Advogados}

      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY?DEEPSEEK_API_KEY is required}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-chat
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY?OPENROUTER_API_KEY is required}
      # Visao de imagem: a foto que o OCR nao conseguiu ler como documento
      # (`app/visao_documento.py`, chamado pelo worker-ocr). Conta SEPARADA de
      # proposito: foto chega pelo portal, em volume que ninguem controla, e
      # estourar o credito dela nao pode emudecer a transcricao da entrevista,
      # que roda na outra conta.
      #
      # OPCIONAL (`:-`) e nao `?required`, ao contrario das de cima, e a escolha
      # e deliberada: obrigatoria, a stack INTEIRA se recusaria a subir ate
      # alguem cadastrar a variavel no GitLab — derrubar producao para adicionar
      # um recurso. Vazia, `visao_documento._chave()` cai na OPENROUTER_API_KEY
      # acima: a leitura de imagem continua funcionando, so gasta a conta da
      # transcricao. Cadastre no escopo prod para valer a separacao.
      OPENROUTER_VISAO_API_KEY: ${OPENROUTER_VISAO_API_KEY:-}

      ZAPSIGN_API_TOKEN: ${ZAPSIGN_API_TOKEN?ZAPSIGN_API_TOKEN is required}
      ZAPSIGN_BASE_URL: https://api.zapsign.com.br/api/v1
      ZAPSIGN_AUTH_MODE: assinaturaTela
      # `1` manda o convite tambem pelo WhatsApp da ZapSign e consome credito
      # do plano — o link ja sai pela nossa Evolution, de graca.
      ZAPSIGN_WHATSAPP: "0"
      # Envio pelo SITE do ZapSign (plano sem API), via navegador. OPCIONAIS: sem
      # eles o recurso fica desligado e nada muda. Crie os valores em
      # GitLab > Settings > CI/CD > Variables (escopo prod) e liste-os em
      # `gitlab_variables` no .gitlab-ci.yml. Ver app/assinatura_navegador.py.
      ZAPSIGN_LOGIN_EMAIL: ${ZAPSIGN_LOGIN_EMAIL:-}
      ZAPSIGN_LOGIN_SENHA: ${ZAPSIGN_LOGIN_SENHA:-}

      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-https://evolution.level33lab.cloud}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY?EVOLUTION_API_KEY is required}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-Advocacia LM}
      GOOGLE_AVALIACAO_URL: https://share.google/BrQVYGnjqdSz3pEw7
      DATAJUD_API_KEY: ${DATAJUD_API_KEY?DATAJUD_API_KEY is required}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}

      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      DIRECTD_TOKEN: ${DIRECTD_TOKEN:-}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_MODEL_NAME: ${EMBEDDINGS_MODEL_NAME:-google/gemini-embedding-001}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-https://openrouter.ai/api/v1}
      DATABASE_URL: ${DATABASE_URL:-}

      AGENTE_API_URL: ${AGENTE_API_URL:-http://ia-juridica:8011}
      JITSI_PUBLIC_URL: ${JITSI_PUBLIC_URL:-https://jitsi.level33lab.cloud}
      JITSI_JWT_APP_ID: ${JITSI_JWT_APP_ID:-level33-chamadas}
      JITSI_JWT_APP_SECRET: ${JITSI_JWT_APP_SECRET?JITSI_JWT_APP_SECRET is required}
      # Interruptor de emergencia da chamada. `0` (padrao) manda a voz sempre
      # pelo videobridge, que e o que faz o 4G do cliente funcionar. Se depois de
      # um deploy TODA chamada emudecer, o bridge esta inalcancavel: ponha `1`
      # aqui e reinicie a api — e lido pelo servidor a cada entrada na sala, sem
      # rebuild do frontend. Ver o comentario em `main.p2p_ligado`.
      CHAMADA_P2P: ${CHAMADA_P2P:-0}

      CELERY_BROKER_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/1
      CELERY_RESULT_BACKEND: redis://:${VALKEY_PASSWORD}@valkey:6379/1
      REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/1
    volumes:
      - dados:/app/dados
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 45s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
      restart_policy:
        condition: any
        delay: "5s"
        max_attempts: 0
        window: "30s"
      resources:
        limits:
          memory: 4G
          cpus: "2.00"
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        # /metrics, /docs e /redoc NAO entram: sao internos e ficam alcancaveis
        # so de dentro da stack. Expor o /metrics publicaria a telemetria do
        # escritorio para quem souber o endereco.
        - "traefik.http.routers.acervo-api.rule=Host(`${DOMINIO?defina o dominio de producao}`) && (PathPrefix(`/api`) || PathPrefix(`/ws/chamada`))"
        - "traefik.http.routers.acervo-api.entrypoints=websecure"
        - "traefik.http.routers.acervo-api.tls=true"
        - "traefik.http.routers.acervo-api.tls.certresolver=httpresolver"
        - "traefik.http.routers.acervo-api.middlewares=hsts-headers"
        - "traefik.http.routers.acervo-api.priority=100"
        - "traefik.http.services.acervo-api.loadbalancer.server.port=8100"
    networks:
      traefik-public:
        aliases:
          - acervo-api
      interna: {}
      psql_db: {}
      cache_shared_net: {}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8100/api/saude',timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  transcricao:
    image: registry.level33lab.cloud/ia/advocacia-ia:${IMAGE_TAG:-latest}
    command: ["uvicorn", "app.servico_transcricao:app", "--host", "0.0.0.0", "--port", "8200", "--ws-ping-interval", "20"]
    environment:
      # `openrouter` OBRIGATORIO: o motor `whisper` e local e quer GPU, que o
      # cluster nao tem. Trocar para whisper aqui derruba a transcricao.
      MOTOR_TRANSCRICAO: openrouter
      OPENROUTER_MODELO_AUDIO: google/gemini-3.7-flash
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY?OPENROUTER_API_KEY is required}
    deploy:
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 45s
      restart_policy:
        condition: any
        delay: "5s"
        max_attempts: 0
        window: "30s"
      resources:
        limits:
          memory: 1G
          cpus: "1.00"
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        # WebSocket nao precisa de label especial no Traefik — ele repassa o
        # Upgrade sozinho. O que precisa e da prioridade acima do front.
        - "traefik.http.routers.acervo-transcricao.rule=Host(`${DOMINIO?defina o dominio de producao}`) && (PathPrefix(`/ws/transcricao`) || PathPrefix(`/entrevista`))"
        - "traefik.http.routers.acervo-transcricao.entrypoints=websecure"
        - "traefik.http.routers.acervo-transcricao.tls=true"
        - "traefik.http.routers.acervo-transcricao.tls.certresolver=httpresolver"
        - "traefik.http.routers.acervo-transcricao.middlewares=hsts-headers"
        - "traefik.http.routers.acervo-transcricao.priority=200"
        - "traefik.http.services.acervo-transcricao.loadbalancer.server.port=8200"
    networks:
      traefik-public:
        aliases:
          - acervo-transcricao
      interna: {}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8200/saude',timeout=5); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # OCR isolado: uma leitura longa nao bloqueia IA, documentos e manutencao.
  worker-ocr:
    image: registry.level33lab.cloud/ia/advocacia-ia:${IMAGE_TAG:-latest}
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--concurrency=1", "-Q", "gpu_background", "-n", "ocr@%h"]
    environment: *ambiente_api
    volumes:
      - dados:/app/dados
    deploy:
      restart_policy:
        condition: any
        delay: "5s"
        max_attempts: 0
        window: "30s"
      resources:
        limits:
          memory: 4G
          cpus: "2.00"
    networks:
      interna: {}
      psql_db: {}
      cache_shared_net: {}

  worker-background:
    image: registry.level33lab.cloud/ia/advocacia-ia:${IMAGE_TAG:-latest}
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--concurrency=1", "-Q", "ai,documents,default,low", "-n", "background@%h"]
    environment: *ambiente_api
    volumes:
      - dados:/app/dados
    deploy:
      restart_policy:
        condition: any
        delay: "5s"
        max_attempts: 0
        window: "30s"
      resources:
        limits:
          memory: 4G
          cpus: "2.00"
    networks:
      interna: {}
      psql_db: {}
      cache_shared_net: {}
  beat:
    image: registry.level33lab.cloud/ia/advocacia-ia:${IMAGE_TAG:-latest}
    command: ["celery", "-A", "app.celery_app:celery_app", "beat"]
    environment: *ambiente_api
    deploy:
      restart_policy:
        condition: any
        delay: "5s"
        max_attempts: 0
        window: "30s"
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
    networks:
      interna: {}
      cache_shared_net: {}

volumes:
  # `api` e `worker` gravam os dois aqui (arquivos de caso, contratos
  # assinados). Volume nomeado em Swarm e POR NO: com mais de um no, os dois
  # precisam de placement constraint no mesmo, ou isto vira armazenamento
  # compartilhado. Ver docs/DEPLOY.md.
  dados:

networks:
  traefik-public:
    external: true
  psql_db:
    external: true
  cache_shared_net:
    external: true
  interna:
