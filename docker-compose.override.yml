version: '3.8'
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: advocacia-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'ForenseFlow@2024'
      MSSQL_PID: 'Express'
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P ForenseFlow@2024 -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
