# Build + deploy vem do componente compartilhado guinb0/ci-cd.
# Os testes sao proprios do projeto.
#
# ---------------------------------------------------------------------------
# FLUXO DE BRANCH (mudado em 2026-09-02)
#
# A `main` NAO dispara pipeline nenhum. Ela e branch de trabalho: merge nela e
# barato, silencioso e nao gasta minuto do orcamento. Todo o pipeline roda de
# uma vez so na branch `production`, na ordem:
#
#     secret_detection + typecheck-frontend  ->  build-image  ->  suite-integracao  ->  deploy
#
# Promover = merge main -> production. Como a verificacao agora vive no MESMO
# pipeline do deploy, suite vermelha = deploy nao acontece (antes a suite rodava
# na main e nao segurava nada).
#
# Consequencia aceita: commit quebrado na main so aparece na hora de promover.
# E o preco de nao ter pipeline no fluxo do dia a dia.
# ---------------------------------------------------------------------------
include:
  - component: gitlab.com/guinb0/ci-cd/deploy@1.5.0
    inputs:
      stack_name: forense-flow
      # O .env do servidor e GERADO a cada deploy a partir das CI/CD variables
      # APPENV_*. Este arquivo lista quais chaves entram; chave sem variavel
      # correspondente e OMITIDA, nunca escrita vazia.
      #
      # O prefixo APPENV_ nao e enfeite: variavel de PROJETO vence a declarada
      # no .gitlab-ci.yml, entao um DATABASE_URL de projeto sobrescreveria o do
      # job de teste e a suite passaria a apontar pro banco de producao.
      env_keys_file: deploy/env.chaves
      # O Next embute NEXT_PUBLIC_* NO BUILD, entao a URL do Jitsi tem de chegar
      # como build-arg — no compose, em runtime, nao muda o bundle. Sai da mesma
      # variable que alimenta o .env, pra nao ter duas fontes.
      build_args: "NEXT_PUBLIC_JITSI_URL=$APPENV_NEXT_PUBLIC_JITSI_URL NEXT_PUBLIC_TURNSTILE_SITE_KEY=$APPENV_NEXT_PUBLIC_TURNSTILE_SITE_KEY"
      # so a production produz; a main nem cria pipeline
      deploy_ref: production
      deploy_when: on_success
      environment_url: https://app.forenseflow.com.br
      # se essa URL nao devolver 200 depois do deploy, o job reverte sozinho
      smoke_url: https://app.forenseflow.com.br/api/saude
  # varredura de segredos vazados (gratuito no plano Free)
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages: [test, build, verificar, deploy]

workflow:
  # push em cima de push cancela o pipeline anterior (so jobs interruptible)
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # MR aberto continua tendo verificacao rapida. Nao custa nada quando nao ha MR.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # unico gatilho em push: a branch que produz
    - if: $CI_COMMIT_BRANCH == "production"
    # tag git (v1.2.3) continua gerando imagem marcada, se um dia adotarmos release
    - if: $CI_COMMIT_TAG
    # NOTA: nao ha regra para a main. Push/merge na main = nenhum pipeline.

default:
  interruptible: true

# ---- qualidade rapida: MR e production. needs: [] = comeca no segundo 0. ----
# Em MR filtra por `changes` (economiza minuto no ciclo curto).
# Na production roda sempre: e a ultima conferida antes de produzir, e 52s
# nao justificam abrir buraco no portao por causa de um `changes` que pode
# se comportar diferente num commit de merge.

typecheck-frontend:
  stage: test
  image: node:22-slim
  needs: []
  timeout: 10m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/**/*
    - if: $CI_COMMIT_BRANCH == "production"
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm]
    policy: pull-push
  before_script:
    - cd frontend && npm ci --cache .npm --prefer-offline
  script:
    - npx tsc --noEmit

secret_detection:
  stage: test
  needs: []
  timeout: 10m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "production"

# ---- suite de integracao: roda os testes do repo contra um Postgres de verdade.
#
# Usa a IMAGEM QUE ACABOU DE SER CONSTRUIDA como ambiente: ela ja tem opencv,
# psycopg, celery e faster-whisper instalados. Instalar requirements.txt num
# python:3.11-slim custaria varios minutos do orcamento de 400 min/mes a cada
# pipeline; assim o unico custo e o pytest.
#
# A imagem nao leva `tests/` (imagem de producao nao carrega teste), entao o job
# copia do workspace pra /app, que pertence ao appuser e e gravavel.
#
# Roda na production, ANTES do deploy — e o portao de producao.
# ------------------------------------------------------------------------------
suite-integracao:
  stage: verificar
  image: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  needs: ["build-image"]
  timeout: 20m
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
  variables:
    POSTGRES_USER: teste
    POSTGRES_PASSWORD: teste
    POSTGRES_DB: teste
    HOME: /tmp
    DATABASE_URL: "postgresql://teste:teste@postgres:5432/teste"
    JOBS_DATABASE_URL: "postgresql://teste:teste@postgres:5432/teste"
    JURIMETRIA_DATABASE_URL: "postgresql://teste:teste@postgres:5432/teste"
    JWT_SECRET: segredo-de-teste
    PORTAL_SEGREDO: segredo-de-teste
    # Modulos fora da suite. Cada um saiu por um motivo medido, nao por chute —
    # tire da lista conforme forem consertados:
    #   test_assinatura    precisa de ZAPSIGN_API_TOKEN (servico externo)
    #   test_concorrencia  precisa de MISTRAL_API_KEY
    #   test_resgate_ocr   precisa de MISTRAL_API_KEY
    #   test_whatsapp      precisa da Evolution configurada (8 falhas)
    #   test_agente        KeyError 'enviados'
    #   test_contrato_api  o mock `registrar` nunca e chamado (call_args e None)
    #   test_supervisao    StopIteration: nao acha o entrevistador "Helena"
    #   test_pipeline      8 falhas de extracao geometrica
    #   test_roteiros      6 falhas
    #   test_entrevista    3 falhas
    #   test_chamada       2 falhas
    #   test_casos         1 falha, e SO quando roda junto dos outros: a suite
    #                      compartilha um banco unico e os testes interferem
    #   test_assinatura_provedores test_gravacao test_login_dois_fatores
    #   test_pdf_selecao test_perfis test_perfis_gestao test_rede_seguranca
    #   test_roteamento_documentos test_uploads_api test_usuarios_edicao
    #   test_valor_documento test_zip_selecao
    #                      vieram do sync com o advocacia e falharam no primeiro
    #                      pipeline da production pos-merge
    QUARENTENA: "test_agente test_assinatura test_casos test_chamada test_concorrencia test_contrato_api test_entrevista test_pipeline test_resgate_ocr test_roteiros test_supervisao test_whatsapp test_assinatura_provedores test_gravacao test_login_dois_fatores test_pdf_selecao test_perfis test_perfis_gestao test_rede_seguranca test_roteamento_documentos test_uploads_api test_usuarios_edicao test_valor_documento test_zip_selecao"
  script:
    - cp -r "$CI_PROJECT_DIR/tests" /app/tests
    - cd /app
    - pip install --user -q pytest
    - |
      passaram=0
      falhou=""
      pulados=0
      for f in tests/test_*.py; do
        m=$(basename "$f" .py)
        case " $QUARENTENA " in
          *" $m "*) pulados=$((pulados+1)); continue ;;
        esac
        if timeout 150 python -m "tests.$m" > /tmp/saida 2>&1; then
          passaram=$((passaram+1))
          echo "  ok   $m"
        else
          echo "  FALHOU  $m"
          tail -15 /tmp/saida | sed "s/^/          /"
          falhou="$falhou $m"
        fi
      done
      echo "==========================================="
      echo "passaram: $passaram | em quarentena: $pulados | falharam:${falhou:- nenhum}"
      test -z "$falhou"

# ---- o deploy vem do componente; aqui so amarramos ele na suite. ----
# Sem isso o `needs: [build-image]` do componente deixaria o deploy correr em
# paralelo com a suite (DAG), e produziria sem esperar o resultado dos testes.
# `optional: true` protege pipeline de tag, onde a suite nao existe.
deploy:
  needs:
    - job: build-image
    - job: suite-integracao
      optional: true
