stages: [test, build, deploy]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---- qualidade (nao bloqueia deploy, bloqueia merge) ----------------
testes-python:
  stage: test
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - pip install --no-cache-dir fastapi httpx "pyjwt[crypto]" python-multipart
  script:
    - python -m tests.test_whatsapp

typecheck-frontend:
  stage: test
  image: node:22-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - cd frontend && npm ci
  script:
    - npx tsc --noEmit

# ---- build da imagem unica -----------------------------------------
build:
  stage: build
  image: docker:27-cli
  services: [docker:27-dind]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true
    - docker build --cache-from "$CI_REGISTRY_IMAGE:latest"
                   --build-arg BUILDKIT_INLINE_CACHE=1
                   --build-arg environment=production
                   -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
                   -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

# ---- deploy no VPS via SSH -----------------------------------------
deploy:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: https://app.forenseflow.com.br
  variables:
    DEPLOY_USER: guilherme
    DEPLOY_HOST: 187.110.160.20
    DEPLOY_DIR: /home/guilherme/forense-flow
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
  script:
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<EOF
        set -euo pipefail
        cd "$DEPLOY_DIR"
        echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
        export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
        docker compose pull
        docker compose up -d
        docker image prune -f
        docker logout "$CI_REGISTRY"
      EOF
