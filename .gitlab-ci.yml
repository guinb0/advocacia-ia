stages:
  - version
  - build-and-push
  - deploy
  - tag
  - notify
  - .pre

# ============================================================
#  Acervo (advocacia-ia) — mesmo componente do vig-agent e do dflegal.
#
#  Só SEGREDO entra em `gitlab_variables`; domínio, modelo e porta de banco
#  ficam fixos no compose, onde se lê junto com o contexto. É o critério do
#  vig-agent, e é menos coisa para cadastrar à mão.
#
#  As variáveis abaixo precisam existir em Settings > CI/CD > Variables com o
#  environment scope `prod`. O compose usa a forma `${VAR?VAR is required}`:
#  faltando qualquer uma, a stack recusa subir em vez de subir quebrada.
#
#  Ver docs/DEPLOY.md.
# ============================================================

include:
  # ============================================================
  # PRODUÇÃO (Branch: production)
  # ============================================================
  - component: $CI_SERVER_FQDN/components/ci-platform/pipeline-generic@1.1.6
    rules:
      - if: $CI_COMMIT_BRANCH == "production"
    inputs:
      trigger_branch: "production"
      env_type: "Production"
      stack_name: "advocacia-ia"
      compose_file: "docker-compose.production.yml"
      tag_prefix: "release/v"
      increment_version: true
      build_args_additional: "environment=production,NEXT_PUBLIC_JITSI_URL=https://jitsi.level33lab.cloud"
      build_args_version: true
      portainer_endpoint_id: "1"
      initial_version: "0.1.0"
      gitlab_variables_environment: "prod"
      # `CHAMADA_P2P` nao e segredo, e entra aqui contra a regra do cabecalho de
      # proposito: e o interruptor de emergencia da chamada, e o valor dele
      # precisa ser trocavel pela interface do GitLab com o cliente na linha.
      # Fixo no compose, virar o interruptor exigiria commit + pipeline inteiro.
      # O compose usa `${CHAMADA_P2P:-0}`, entao a stack sobe mesmo sem ele.
      gitlab_variables: '["DOMINIO","SQLSERVER_HOST","SQLSERVER_PASSWORD","PGVECTOR_HOST","PGVECTOR_USER","PGVECTOR_PASSWORD","JWT_SECRET","PORTAL_SEGREDO","DEEPSEEK_API_KEY","OPENAI_API_KEY","OPENAI_BASE_URL","OPENAI_CHAT_MODEL","OPENROUTER_API_KEY","OPENROUTER_OCR_FALLBACK_KEY","ZAPSIGN_API_TOKEN","DATAJUD_API_KEY","EVOLUTION_API_URL","EVOLUTION_API_KEY","EVOLUTION_INSTANCE","MISTRAL_API_KEY","DIRECTD_TOKEN","EMBEDDINGS_API_KEY","DATABASE_URL","AGENTE_API_URL","JITSI_PUBLIC_URL","JITSI_JWT_APP_ID","JITSI_JWT_APP_SECRET","VALKEY_PASSWORD","ZAPSIGN_LOGIN_EMAIL","ZAPSIGN_LOGIN_SENHA","SMTP_USUARIO","SMTP_SENHA","CHAMADA_P2P"]'

# Correção local do job do componente 1.1.6. O original usa
# `git tag ... | head -n 1`; o runner executa com `pipefail`, então o Git recebe
# SIGPIPE quando o `head` fecha a leitura e o job termina com código 141 antes
# de criar `version.env`. `sed -n '1p'` consome a entrada inteira e preserva a
# mesma ordenação sem quebrar o produtor do pipe.
generate-version:
  # `stage` e `rules` REPETIDOS AQUI, e não é redundância.
  #
  # Este bloco sobrescreve um job do componente — mas o componente só entra na
  # branch `production` (ver o `rules` do `include`, acima). Nas outras branches
  # não há job para mesclar: este vira um job NOVO, herda o stage padrão do
  # GitLab (`test`), e `test` não está na lista de `stages` deste arquivo. O
  # resultado não é um job que falha, é o pipeline inteiro que não chega a ser
  # criado: "chosen stage test does not exist".
  #
  # Com a mesma condição do `include`, ele existe exatamente onde há o que
  # sobrescrever, e com o stage declarado não depende de herança para ser válido.
  stage: version
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
  script:
    - |
      TAG_PREFIX="release/v"
      echo "=== Gerando próxima versão (Prefixo: $TAG_PREFIX) ==="
      git fetch --tags --force

      LATEST_TAG=$(git tag -l "${TAG_PREFIX}*" --sort=-v:refname | sed -n '1p')
      if [ -z "$LATEST_TAG" ]; then
        NEW_VERSION="0.1.0"
      else
        VERSION_STRING=${LATEST_TAG#"$TAG_PREFIX"}
        MAJOR=$(echo "$VERSION_STRING" | cut -d. -f1)
        MINOR=$(echo "$VERSION_STRING" | cut -d. -f2)
        PATCH=$(echo "$VERSION_STRING" | cut -d. -f3)
        NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
      fi

      FULL_TAG="${TAG_PREFIX}${NEW_VERSION}"
      echo "Última tag: ${LATEST_TAG:-nenhuma}"
      echo "Próxima versão: ${NEW_VERSION}"
      echo "NEW_VERSION=${NEW_VERSION}" > version.env
      echo "GIT_RELEASE_TAG=${FULL_TAG}" >> version.env
      echo "IMAGE_TAG_TO_DEPLOY=${NEW_VERSION}" >> version.env

# ============================================================
# QUALIDADE: roda em toda branch e em todo MR.
#
# Existe porque o pipeline de deploy só olha `release` e `production`, e até
# agora nada segurava um `tsc` quebrado antes de chegar lá. Não bloqueia
# deploy — bloqueia merge, que é onde ainda é barato consertar.
# ============================================================
testes-python:
  stage: .pre
  image: python:3.11-slim
  rules:
    - if: $CI_COMMIT_BRANCH != "production"
  before_script:
    # Sem paddle nem pyodbc: a suíte do WhatsApp toca httpx e fastapi apenas, e
    # instalar o requirements inteiro (paddle, ~1 GB) custaria minutos de runner
    # a cada push.
    - pip install --no-cache-dir fastapi httpx "pyjwt[crypto]" python-multipart
  script:
    - python -m tests.test_whatsapp

typecheck-frontend:
  stage: .pre
  image: node:22-slim
  rules:
    - if: $CI_COMMIT_BRANCH != "production"
  before_script:
    - cd frontend && npm ci
  script:
    - npx tsc --noEmit

# ============================================================
# FALLBACK: Aviso para outras branches
# ============================================================
no-op:
  stage: .pre
  image: alpine:latest
  script:
    - echo "ℹ️  Branch '${CI_COMMIT_BRANCH}' não possui pipeline de CI/CD configurado."
    - echo "📋 Pipelines disponíveis:"
    - echo "   - 'production' → Pipeline de Produção (Build + Deploy)"
  rules:
    - if: $CI_COMMIT_BRANCH != "production"

# ============================================================
# OPERAÇÃO: reparo da pasta da stack no Portainer (manual).
#
# O redeploy falha com "stat /data/compose/133: no such file or directory" e o CLI
# do componente só tem auth/list/redeploy/create. As credenciais do Portainer
# (PORTAINER_USER/PORTAINER_PASS) só existem em jobs da branch protegida.
#
# OPERACAO=inspecionar  somente leitura: acha o volume de dados do Portainer.
#                       Não imprime `Env` da stack (tem segredos) nem credenciais.
# OPERACAO=criar_pasta  container Alpine efêmero que monta esse volume e executa SÓ
#                       `mkdir -p /data/compose/133`, e depois o remove. Não toca em
#                       nenhuma outra pasta, stack ou serviço.
# ============================================================
portainer-operacao:
  stage: .pre
  needs: []
  image: pdrh/portainer-go-cli:0.0.12
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
      when: manual
      allow_failure: true
  variables:
    OPERACAO: "criar_pasta"
  script:
    - |
      set -e
      URL="https://portainer.level33lab.cloud"
      STACK_ID=133
      JWT=$(wget -qO- --header='Content-Type: application/json' --post-data="$(jq -nc --arg u "$PORTAINER_USER" --arg p "$PORTAINER_PASS" '{username:$u,password:$p}')" "$URL/api/auth" | jq -r .jwt)
      [ -n "$JWT" ] && [ "$JWT" != "null" ] || { echo "falha de autenticacao"; exit 1; }
      D="$URL/api/endpoints/1/docker"
      get() { wget -qO- --header="Authorization: Bearer $JWT" "$@"; }
      post() { wget -qO- --header="Authorization: Bearer $JWT" --header='Content-Type: application/json' --post-data="$2" "$1"; }

      echo "== container(s) do Portainer e mounts de /data"
      get "$D/containers/json?all=1" | jq -c '[.[] | select(.Image | test("portainer/portainer")) | {Names, Image, State, Mounts: [.Mounts[] | select(.Destination == "/data") | {Type, Name, Source, Destination}]}]'
      echo "== nos do swarm"
      get "$D/nodes" | jq -c '[.[] | {ID: .ID[0:12], Hostname: .Description.Hostname, Role: .Spec.Role, State: .Status.State}]' || true

      MOUNT=$(get "$D/containers/json?all=1" | jq -c '[.[] | select(.Image | test("portainer/portainer")) | .Mounts[] | select(.Destination == "/data")] | unique')
      QTD=$(echo "$MOUNT" | jq 'length')
      echo "candidatos a volume de dados: $QTD"
      if [ "$QTD" != "1" ]; then echo "abortando: esperado exatamente 1 mount de /data"; exit 1; fi
      FONTE=$(echo "$MOUNT" | jq -r '.[0] | if .Type == "volume" then .Name else .Source end')
      echo "fonte do mount: $FONTE"
      if [ "$OPERACAO" != "criar_pasta" ]; then echo "modo inspecionar: nada foi alterado"; exit 0; fi

      echo "== criando a pasta da stack $STACK_ID"
      post "$D/images/create?fromImage=alpine&tag=3.20" "" >/dev/null
      CID=$(post "$D/containers/create?name=portainer-mkdir-stack-$STACK_ID" "$(jq -nc --arg b "$FONTE:/data" '{Image:"alpine:3.20", Cmd:["sh","-c","mkdir -p /data/compose/133 && ls -ld /data/compose/133 && ls /data/compose | wc -l"], HostConfig:{Binds:[$b]}}')" | jq -r .Id)
      echo "container auxiliar: ${CID:0:12}"
      post "$D/containers/$CID/start" "" >/dev/null || true
      post "$D/containers/$CID/wait" "" | jq -c . || true
      get "$D/containers/$CID/logs?stdout=1&stderr=1" | strings
      wget -qO- --header="Authorization: Bearer $JWT" --method=DELETE "$D/containers/$CID?force=true" >/dev/null || echo "remova manualmente o container portainer-mkdir-stack-$STACK_ID"
      echo "pronto"
