# Build + deploy vem do componente compartilhado guinb0/ci-cd.
# Os testes (qualidade em MR) sao proprios do projeto.
include:
  - component: gitlab.com/guinb0/ci-cd/deploy@1.0.5
    inputs:
      stack_name: forense-flow
      deploy_when: manual
      environment_url: https://app.forenseflow.com.br

stages: [test, build, deploy]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---- qualidade: roda em MR; nao bloqueia deploy, bloqueia merge ----
testes-python:
  stage: test
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - pip install --no-cache-dir fastapi httpx "pyjwt[crypto]" python-multipart
  script:
    - python -m tests.test_whatsapp

typecheck-frontend:
  stage: test
  image: node:22-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - cd frontend && npm ci
  script:
    - npx tsc --noEmit
